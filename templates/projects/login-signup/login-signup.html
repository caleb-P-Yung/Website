<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
</head>
<body>
    <h2>Sign Up</h2>
    <form id="signupForm">
        <input type="text" id="signupUsername" placeholder="Username" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <h2>Sign In</h2>
    <form id="signinForm">
        <input type="text" id="signinUsername" placeholder="Username" required>
        <input type="password" id="signinPassword" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>

    <script>
    // --- Sign Up ---
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const usrN = document.getElementById("signupUsername").value;
        const usrpass = document.getElementById("signupPassword").value;

        const res = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usrN, usrpass })
        });

        const data = await res.json();
        alert(data.message);
    });

    // --- Sign In ---
    document.getElementById("signinForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const usrN = document.getElementById("signinUsername").value;
        const usrpass = document.getElementById("signinPassword").value;

        const res = await fetch("/api/signin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usrN, usrpass })
        });

        const data = await res.json();
        
        if (res.ok) {
            // ✅ Store login state
            localStorage.setItem("isSignedIn", "true");
            localStorage.setItem("username", usrN);

            // Redirect to /selector
            window.location.href = "/selector";
        } else {
            alert(data.message);
        }
    });

    // Optional: Auto-redirect if already signed in
    if (localStorage.getItem("isSignedIn") === "true") {
        window.location.href = "/selector";
    }
    </script>
</body>
</html>
