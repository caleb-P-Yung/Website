<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .quiz-container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .question {
            margin-bottom: 15px;
        }
        input[type="radio"] {
            cursor: pointer; /* Set pointer cursor for radio buttons */
        }
        button {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>Topic Quiz</h2>
        <div id="quiz"></div>
        <button id="submit-btn" onclick="checkAnswers()">Submit</button>
        <p id="result"></p>
        <button id = "back" class="back" onclick="window.close(); window.open('http://127.0.0.1:5500/Java%20script%20and%20html%20projects/quiz_selector.html', '_blank')">See home screen</button>
    </div>
    <script>
        let quizData = []; // will be filled in by fetch

const c = document.getElementById("back");
const quizContainer = document.getElementById('quiz');
const resultContainer = document.getElementById('result');
const submitBtn = document.getElementById('submit-btn');
c.style.cursor = "unset";
submitBtn.style.cursor = "pointer";

async function loadQuiz() {
    const response = await fetch('/api/quiz5');
    quizData = await response.json();

    let output = '';
    quizData.forEach((q, index) => {
        output += `<div class="question">
            <p>${q.question}</p>
            <input type="radio" name="q${index}" value="a"> ${q.a}<br>
            <input type="radio" name="q${index}" value="b"> ${q.b}<br>
            <input type="radio" name="q${index}" value="c"> ${q.c}<br>
            <input type="radio" name="q${index}" value="d"> ${q.d}<br>
        </div>`;
    });
    quizContainer.innerHTML = output;
}

function checkAnswers() {
    let score = 0;
    quizData.forEach((q, index) => {
        const answer = document.querySelector(`input[name="q${index}"]:checked`);
        if (answer && answer.value === q.correct) {
            score++;
        }
    });
    resultContainer.innerHTML = `You scored ${score} out of ${quizData.length}`;

    const radios = document.querySelectorAll('input[type="radio"]');
    radios.forEach((radio) => {
        radio.disabled = true;
        radio.style.cursor = "unset";
    });
    localStorage.setItem("score5", score);
    localStorage.setItem("scorel5", quizData.length);

    submitBtn.disabled = true;
    submitBtn.style.cursor = "unset";
    c.disabled = false;
    c.style.cursor = "pointer";
}

window.onload = loadQuiz;
    </script>
</body>
</html>
